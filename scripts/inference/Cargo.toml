[package]
name = "geoguessr_inference"
version = "0.1.0"
edition = "2021"

[lib]
name = "geoguessr_inference"
crate-type = ["cdylib"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
